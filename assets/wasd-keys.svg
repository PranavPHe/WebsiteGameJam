<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200" viewBox="0 0 520 200">
  <defs>
    <style>
      .kbd { fill: #0e374b; stroke: #9fe7ff; stroke-width: 3px; rx: 10px; }
      .key-text { font-family: Poppins, Arial, sans-serif; font-weight: 700; fill: #ffd166; font-size: 28px; }
      .label { font-family: Poppins, Arial, sans-serif; fill: #e8f6fb; font-size: 14px; }
    </style>
  </defs>

  <!-- WASD block -->
  <g transform="translate(20,20)">
    <rect class="kbd" x="0" y="0" width="180" height="120" rx="12"/>
    <text class="key-text" x="50" y="48">W</text>
    <text class="key-text" x="15" y="86">A</text>
    <text class="key-text" x="85" y="86">S</text>
    <text class="key-text" x="140" y="86">D</text>
  </g>

  <!-- Space and Q -->
  <g transform="translate(230,40)">
    <rect class="kbd" x="0" y="20" width="240" height="40" rx="10"/>
    <text class="key-text" x="100" y="48">Space</text>
    <text class="label" x="0" y="-2">Shoot</text>

    <rect class="kbd" x="0" y="80" width="60" height="40" rx="10"/>
    <text class="key-text" x="18" y="108">Q</text>
    <text class="label" x="70" y="105">Switch fish</text>
  </g>

</svg>
